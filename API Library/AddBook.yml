info:
  name: AddBook
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/books
  body:
    type: json
    data: |-
      {
          "title": "Las aventuras Tom Sawyer",
          "author": "Oscar Wilde",
          "year": 1985
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
